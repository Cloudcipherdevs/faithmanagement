<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faith Connect - Church Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>
        const state = {
            currentUser: null,
            currentPage: 'login',
            mobileMenuOpen: false,
            readings: [],
            announcements: [],
            bookings: [],
            prayers: [],
            events: [],
            offerings: [],
            tithes: [],
            donations: [],
            expenses: [],
            budgets: [],
            searchTerm: '',
            otpSent: false,
            isNewUser: false,
            phoneNumber: '',
            showForms: {}
        };

        const storage = {
            get: (key) => {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : null;
            },
            set: (key, value) => {
                localStorage.setItem(key, JSON.stringify(value));
            },
            remove: (key) => {
                localStorage.removeItem(key);
            }
        };

        function loadData() {
            state.currentUser = storage.get('current_user');
            state.readings = storage.get('readings') || [];
            state.announcements = storage.get('announcements') || [];
            state.bookings = storage.get('bookings') || [];
            state.prayers = storage.get('prayers') || [];
            state.events = storage.get('events') || [];
            state.offerings = storage.get('offerings') || [];
            state.tithes = storage.get('tithes') || [];
            state.donations = storage.get('donations') || [];
            state.expenses = storage.get('expenses') || [];
            state.budgets = storage.get('budgets') || [];
            
            if (state.currentUser) {
                state.currentPage = 'dashboard';
            }
        }

        function handleSendOTP() {
            const phoneInput = document.getElementById('phoneNumber');
            if (phoneInput && phoneInput.value.length >= 10) {
                state.phoneNumber = phoneInput.value;
                state.otpSent = true;
                state.isNewUser = phoneInput.value !== '0112308046';
                render();
            }
        }

        function handleChangeNumber() {
            state.otpSent = false;
            state.isNewUser = false;
            render();
        }

        function handleLogin() {
            const otpInput = document.getElementById('otp');
            const userNameInput = document.getElementById('userName');
            
            if (otpInput && otpInput.value === '1234') {
                const user = {
                    phone: state.phoneNumber,
                    name: userNameInput ? userNameInput.value : 'Member',
                    role: state.phoneNumber === '0112308046' ? 'admin' : 'member',
                    joinedDate: new Date().toISOString()
                };
                state.currentUser = user;
                storage.set('current_user', user);
                state.currentPage = 'dashboard';
                render();
            } else {
                alert('Invalid OTP. Please use 1234');
            }
        }

        function handleLogout() {
            state.currentUser = null;
            storage.remove('current_user');
            state.currentPage = 'login';
            render();
        }

        function changePage(page) {
            state.currentPage = page;
            state.mobileMenuOpen = false;
            render();
        }

        function toggleMobileMenu() {
            state.mobileMenuOpen = !state.mobileMenuOpen;
            render();
        }

        function toggleForm(formType) {
            state.showForms[formType] = !state.showForms[formType];
            render();
        }

        function handleSearch(value) {
            state.searchTerm = value;
            render();
        }

        // Financial Functions
        function addOffering() {
            const date = document.getElementById('offeringDate').value;
            const amount = parseFloat(document.getElementById('offeringAmount').value);
            const type = document.getElementById('offeringType').value;
            const notes = document.getElementById('offeringNotes').value;

            if (date && amount) {
                const offering = {
                    id: Date.now(),
                    date,
                    amount,
                    type,
                    notes,
                    addedBy: state.currentUser.name
                };
                state.offerings.unshift(offering);
                storage.set('offerings', state.offerings);
                state.showForms.offering = false;
                render();
            } else {
                alert('Please fill in required fields');
            }
        }

        function addTithe() {
            const date = document.getElementById('titheDate').value;
            const amount = parseFloat(document.getElementById('titheAmount').value);
            const contributor = document.getElementById('titheContributor').value;
            const notes = document.getElementById('titheNotes').value;

            if (date && amount && contributor) {
                const tithe = {
                    id: Date.now(),
                    date,
                    amount,
                    contributor,
                    notes,
                    addedBy: state.currentUser.name
                };
                state.tithes.unshift(tithe);
                storage.set('tithes', state.tithes);
                state.showForms.tithe = false;
                render();
            } else {
                alert('Please fill in required fields');
            }
        }

        function addDonation() {
            const date = document.getElementById('donationDate').value;
            const amount = parseFloat(document.getElementById('donationAmount').value);
            const donor = document.getElementById('donationDonor').value;
            const purpose = document.getElementById('donationPurpose').value;
            const notes = document.getElementById('donationNotes').value;

            if (date && amount && donor) {
                const donation = {
                    id: Date.now(),
                    date,
                    amount,
                    donor,
                    purpose,
                    notes,
                    addedBy: state.currentUser.name
                };
                state.donations.unshift(donation);
                storage.set('donations', state.donations);
                state.showForms.donation = false;
                render();
            } else {
                alert('Please fill in required fields');
            }
        }

        function addExpense() {
            const date = document.getElementById('expenseDate').value;
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const category = document.getElementById('expenseCategory').value;
            const description = document.getElementById('expenseDescription').value;
            const payee = document.getElementById('expensePayee').value;

            if (date && amount && category && description) {
                const expense = {
                    id: Date.now(),
                    date,
                    amount,
                    category,
                    description,
                    payee,
                    addedBy: state.currentUser.name
                };
                state.expenses.unshift(expense);
                storage.set('expenses', state.expenses);
                state.showForms.expense = false;
                render();
            } else {
                alert('Please fill in required fields');
            }
        }

        function addBudget() {
            const name = document.getElementById('budgetName').value;
            const amount = parseFloat(document.getElementById('budgetAmount').value);
            const category = document.getElementById('budgetCategory').value;
            const startDate = document.getElementById('budgetStartDate').value;
            const endDate = document.getElementById('budgetEndDate').value;
            const description = document.getElementById('budgetDescription').value;

            if (name && amount && category && startDate && endDate) {
                const budget = {
                    id: Date.now(),
                    name,
                    amount,
                    category,
                    startDate,
                    endDate,
                    description,
                    spent: 0,
                    createdBy: state.currentUser.name
                };
                state.budgets.push(budget);
                storage.set('budgets', state.budgets);
                state.showForms.budget = false;
                render();
            } else {
                alert('Please fill in required fields');
            }
        }

        function calculateFinancials() {
            const totalOfferings = state.offerings.reduce((sum, o) => sum + o.amount, 0);
            const totalTithes = state.tithes.reduce((sum, t) => sum + t.amount, 0);
            const totalDonations = state.donations.reduce((sum, d) => sum + d.amount, 0);
            const totalIncome = totalOfferings + totalTithes + totalDonations;
            const totalExpenses = state.expenses.reduce((sum, e) => sum + e.amount, 0);
            const netBalance = totalIncome - totalExpenses;

            return {
                totalOfferings,
                totalTithes,
                totalDonations,
                totalIncome,
                totalExpenses,
                netBalance
            };
        }

        // Data management functions
        function addReading() {
            const title = document.getElementById('readingTitle').value;
            const date = document.getElementById('readingDate').value;
            const scripture = document.getElementById('readingScripture').value;
            const content = document.getElementById('readingContent').value;
            const audioUrl = document.getElementById('readingAudio').value;

            if (title && content) {
                state.readings.unshift({
                    id: Date.now(), title, date, scripture, content, audioUrl,
                    addedBy: state.currentUser.name
                });
                storage.set('readings', state.readings);
                state.showForms.reading = false;
                render();
            }
        }

        function addAnnouncement() {
            const title = document.getElementById('announcementTitle').value;
            const priority = document.getElementById('announcementPriority').value;
            const content = document.getElementById('announcementContent').value;

            if (title && content) {
                state.announcements.unshift({
                    id: Date.now(), title, priority, content,
                    date: new Date().toLocaleDateString(),
                    addedBy: state.currentUser.name
                });
                storage.set('announcements', state.announcements);
                state.showForms.announcement = false;
                render();
            }
        }

        function addBooking() {
            const pastor = document.getElementById('bookingPastor').value;
            const date = document.getElementById('bookingDate').value;
            const time = document.getElementById('bookingTime').value;
            const reason = document.getElementById('bookingReason').value;

            if (date && time && reason) {
                state.bookings.push({
                    id: Date.now(), pastor, date, time, reason,
                    memberName: state.currentUser.name,
                    memberPhone: state.currentUser.phone,
                    status: 'pending'
                });
                storage.set('bookings', state.bookings);
                state.showForms.booking = false;
                render();
            }
        }

        function selectTimeSlot(time) {
            document.getElementById('bookingTime').value = time;
            document.querySelectorAll('.time-slot').forEach(slot => {
                if (slot.textContent.trim() === time) {
                    slot.classList.add('border-purple-600', 'bg-purple-50', 'text-purple-700', 'font-semibold');
                    slot.classList.remove('border-gray-300');
                } else {
                    slot.classList.remove('border-purple-600', 'bg-purple-50', 'text-purple-700', 'font-semibold');
                    slot.classList.add('border-gray-300');
                }
            });
        }

        function addPrayer() {
            const title = document.getElementById('prayerTitle').value;
            const content = document.getElementById('prayerContent').value;

            if (title && content) {
                state.prayers.unshift({
                    id: Date.now(), title, content,
                    author: state.currentUser.name,
                    date: new Date().toLocaleDateString(),
                    prayerCount: 0
                });
                storage.set('prayers', state.prayers);
                state.showForms.prayer = false;
                render();
            }
        }

        function addPrayerSupport(prayerId) {
            const prayer = state.prayers.find(p => p.id === prayerId);
            if (prayer) {
                prayer.prayerCount++;
                storage.set('prayers', state.prayers);
                render();
            }
        }

        function addEvent() {
            const title = document.getElementById('eventTitle').value;
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const location = document.getElementById('eventLocation').value;
            const description = document.getElementById('eventDescription').value;

            if (title && date && time) {
                state.events.push({
                    id: Date.now(), title, date, time, location, description,
                    organizer: state.currentUser.name
                });
                state.events.sort((a, b) => new Date(a.date) - new Date(b.date));
                storage.set('events', state.events);
                state.showForms.event = false;
                render();
            }
        }

        // Render Functions
        function renderLoginPage() {
            return `
                <div class="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in">
                        <div class="text-center mb-8">
                            <div class="bg-gradient-to-r from-blue-600 to-purple-600 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-4xl">
                                ⛪
                            </div>
                            <h1 class="text-3xl font-bold text-gray-800 mb-2">Faith Connect</h1>
                            <p class="text-gray-600">Your Church Community Platform</p>
                        </div>

                        ${!state.otpSent ? `
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Mobile Number</label>
                                    <input type="tel" id="phoneNumber" placeholder="Enter your mobile number"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                </div>
                                <button onclick="handleSendOTP()"
                                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:shadow-lg transition-all">
                                    Send OTP
                                </button>
                                <p class="text-xs text-center text-gray-500">Demo: Use any number, OTP is 1234</p>
                            </div>
                        ` : `
                            <div class="space-y-4">
                                ${state.isNewUser ? `
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Your Name</label>
                                        <input type="text" id="userName" placeholder="Enter your name"
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    </div>
                                ` : ''}
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Enter OTP</label>
                                    <input type="text" id="otp" placeholder="Enter 6-digit OTP"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    <p class="text-xs text-gray-500 mt-2">Demo OTP: 1234</p>
                                </div>
                                <button onclick="handleLogin()"
                                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:shadow-lg transition-all">
                                    Verify & Login
                                </button>
                                <button onclick="handleChangeNumber()"
                                    class="w-full text-gray-600 py-2 text-sm hover:text-gray-800">
                                    Change Number
                                </button>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderNavigation() {
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: '🏠' },
                { id: 'readings', label: 'Readings', icon: '📖' },
                { id: 'announcements', label: 'Announcements', icon: '📢' },
                { id: 'bookings', label: 'Bookings', icon: '📅' },
                { id: 'prayers', label: 'Prayer Wall', icon: '🙏' },
                { id: 'events', label: 'Events', icon: '🎉' },
                { id: 'finances', label: 'Finances', icon: '💰' }
            ];

            return `
                <nav class="bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg">
                    <div class="max-w-7xl mx-auto px-4">
                        <div class="flex justify-between items-center h-16">
                            <div class="flex items-center space-x-3">
                                <span class="text-xl font-bold">⛪ Faith Connect</span>
                            </div>
                            
                            <div class="hidden md:flex space-x-1">
                                ${navItems.map(item => `
                                    <button onclick="changePage('${item.id}')"
                                        class="px-4 py-2 rounded-lg transition-all ${state.currentPage === item.id ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}">
                                        ${item.icon} ${item.label}
                                    </button>
                                `).join('')}
                            </div>

                            <div class="flex items-center space-x-4">
                                <span class="hidden md:inline text-sm">👤 ${state.currentUser.name}</span>
                                <button onclick="handleLogout()" class="hover:bg-white hover:bg-opacity-10 px-3 py-2 rounded-lg transition-all text-sm">
                                    Logout
                                </button>
                                <button onclick="toggleMobileMenu()" class="md:hidden p-2">
                                    ${state.mobileMenuOpen ? '✕' : '☰'}
                                </button>
                            </div>
                        </div>
                    </div>

                    ${state.mobileMenuOpen ? `
                        <div class="md:hidden bg-white bg-opacity-10">
                            ${navItems.map(item => `
                                <button onclick="changePage('${item.id}')"
                                    class="w-full text-left px-6 py-3 hover:bg-white hover:bg-opacity-10 ${state.currentPage === item.id ? 'bg-white bg-opacity-20' : ''}">
                                    ${item.icon} ${item.label}
                                </button>
                            `).join('')}
                        </div>
                    ` : ''}
                </nav>
            `;
        }

        function renderDashboard() {
            const financials = calculateFinancials();
            
            return `
                <div class="max-w-7xl mx-auto px-4 py-8 fade-in">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Welcome, ${state.currentUser.name}!</h2>
                    <p class="text-gray-600 mb-8">
                        ${state.currentUser.role === 'admin' ? '👑 Administrator Access' : '📱 ' + state.currentUser.phone}
                    </p>
                    
                    <!-- Financial Overview -->
                    <div class="bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl shadow-lg p-6 text-white mb-8">
                        <h3 class="text-xl font-bold mb-4">💰 Financial Summary</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <p class="text-sm opacity-90">Total Income</p>
                                <p class="text-3xl font-bold">KES ${financials.totalIncome.toLocaleString()}</p>
                            </div>
                            <div>
                                <p class="text-sm opacity-90">Total Expenses</p>
                                <p class="text-3xl font-bold">KES ${financials.totalExpenses.toLocaleString()}</p>
                            </div>
                            <div>
                                <p class="text-sm opacity-90">Net Balance</p>
                                <p class="text-3xl font-bold ${financials.netBalance >= 0 ? 'text-green-200' : 'text-red-200'}">
                                    KES ${financials.netBalance.toLocaleString()}
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Stats Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div class="bg-white rounded-xl shadow-lg p-6">
                            <div class="text-4xl mb-2">📖</div>
                            <p class="text-gray-600 text-sm">Readings</p>
                            <p class="text-2xl font-bold text-gray-800">${state.readings.length}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-lg p-6">
                            <div class="text-4xl mb-2">📅</div>
                            <p class="text-gray-600 text-sm">Events</p>
                            <p class="text-2xl font-bold text-gray-800">${state.events.length}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-lg p-6">
                            <div class="text-4xl mb-2">🙏</div>
                            <p class="text-gray-600 text-sm">Prayers</p>
                            <p class="text-2xl font-bold text-gray-800">${state.prayers.length}</p>
                        </div>
                        <div class="bg-white rounded-xl shadow-lg p-6">
                            <div class="text-4xl mb-2">📢</div>
                            <p class="text-gray-600 text-sm">Announcements</p>
                            <p class="text-2xl font-bold text-gray-800">${state.announcements.length}</p>
                        </div>
                    </div>

                    <!-- Quick Access -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white rounded-xl shadow-lg p-6">
                            <h3 class="text-xl font-bold text-gray-800 mb-4">📖 Latest Reading</h3>
                            ${state.readings.length > 0 ? `
                                <div class="border-l-4 border-blue-600 pl-4">
                                    <p class="text-sm text-gray-500">${state.readings[0].date}</p>
                                    <p class="font-semibold text-gray-800 mt-1">${state.readings[0].title}</p>
                                    <p class="text-gray-600 mt-2 line-clamp-3">${state.readings[0].content}</p>
                                </div>
                            ` : '<p class="text-gray-500">No readings available yet</p>'}
                        </div>

                        <div class="bg-white rounded-xl shadow-lg p-6">
                            <h3 class="text-xl font-bold text-gray-800 mb-4">📅 Upcoming Events</h3>
                            ${state.events.length > 0 ? `
                                <div class="space-y-3">
                                    ${state.events.slice(0, 3).map(event => `
                                        <div class="p-3 bg-purple-50 rounded-lg">
                                            <p class="font-semibold text-gray-800">${event.title}</p>
                                            <p class="text-sm text-gray-600">${event.date} at ${event.time}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : '<p class="text-gray-500">No upcoming events</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFinancesPage() {
            const financials = calculateFinancials();
            const currentView = state.financeView || 'overview';

            return `
                <div class="max-w-7xl mx-auto px-4 py-8 fade-in">
                    <h2 class="text-3xl font-bold text-gray-800 mb-8">💰 Financial Management</h2>

                    <!-- Tab Navigation -->
                    <div class="bg-white rounded-xl shadow-lg p-2 mb-8 flex flex-wrap gap-2">
                        ${['overview', 'offerings', 'tithes', 'donations', 'expenses', 'budgets'].map(view => `
                            <button onclick="state.financeView='${view}'; render()"
                                class="px-4 py-2 rounded-lg transition-all ${currentView === view ? 'bg-blue-600 text-white' : 'hover:bg-gray-100'}">
                                ${view.charAt(0).toUpperCase() + view.slice(1)}
                            </button>
                        `).join('')}
                    </div>

                    ${currentView === 'overview' ? renderFinanceOverview(financials) :
                      currentView === 'offerings' ? renderOfferingsView() :
                      currentView === 'tithes' ? renderTithesView() :
                      currentView === 'donations' ? renderDonationsView() :
                      currentView === 'expenses' ? renderExpensesView() :
                      renderBudgetsView()}
                </div>
            `;
        }

        function renderFinanceOverview(financials) {
            const allIncome = [...state.offerings, ...state.tithes, ...state.donations]
                .sort((a, b) => b.id - a.id)
                .slice(0, 5);
            
            let incomeHTML = '';
            for (let i = 0; i < allIncome.length; i++) {
                const item = allIncome[i];
                const itemType = item.type || item.purpose || 'Tithe';
                incomeHTML += '<div class="flex justify-between items-center p-3 bg-green-50 rounded-lg">';
                incomeHTML += '<div>';
                incomeHTML += '<p class="font-semibold text-gray-800">' + itemType + '</p>';
                incomeHTML += '<p class="text-sm text-gray-600">' + item.date + '</p>';
                incomeHTML += '</div>';
                incomeHTML += '<p class="text-green-600 font-bold">+KES ' + item.amount.toLocaleString() + '</p>';
                incomeHTML += '</div>';
            }
            
            let expenseHTML = '';
            const recentExpenses = state.expenses.slice(0, 5);
            for (let i = 0; i < recentExpenses.length; i++) {
                const expense = recentExpenses[i];
                expenseHTML += '<div class="flex justify-between items-center p-3 bg-red-50 rounded-lg">';
                expenseHTML += '<div>';
                expenseHTML += '<p class="font-semibold text-gray-800">' + expense.description + '</p>';
                expenseHTML += '<p class="text-sm text-gray-600">' + expense.category + ' • ' + expense.date + '</p>';
                expenseHTML += '</div>';
                expenseHTML += '<p class="text-red-600 font-bold">-KES ' + expense.amount.toLocaleString() + '</p>';
                expenseHTML += '</div>';
            }
            
            if (state.expenses.length === 0) {
                expenseHTML = '<p class="text-gray-500">No expenses recorded</p>';
            }
            
            return '<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">' +
                '<div class="bg-gradient-to-br from-green-500 to-green-600 rounded-xl shadow-lg p-6 text-white">' +
                '<p class="text-sm opacity-90 mb-1">Total Income</p>' +
                '<p class="text-4xl font-bold mb-2">KES ' + financials.totalIncome.toLocaleString() + '</p>' +

                        <h2 class="text-3xl font-bold text-gray-800">📅 Pastoral Bookings</h2>
                        <button onclick="toggleForm('booking')"
                            class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700">
                            ➕ Book Appointment
                        </button>
                    </div>

                    ${state.showForms.booking ? `
                        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
                            <h3 class="text-xl font-bold text-gray-800 mb-4">Book Pastoral Appointment</h3>
                            <div class="space-y-4">
                                <select id="bookingPastor" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                                    <option>Pastor John</option>
                                    <option>Pastor Mary</option>
                                    <option>Pastor David</option>
                                </select>
                                <input type="date" id="bookingDate" min="${new Date().toISOString().split('T')[0]}"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                                <input type="hidden" id="bookingTime">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Select Time Slot</label>
                                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                                        ${timeSlots.map(slot => `
                                            <button type="button" onclick="selectTimeSlot('${slot}')"
                                                class="time-slot px-4 py-3 rounded-lg border-2 border-gray-300 hover:border-purple-400 transition-all">
                                                ${slot}
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                                <textarea id="bookingReason" placeholder="Reason for appointment" rows="4"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg"></textarea>
                                <div class="flex gap-4">
                                    <button onclick="addBooking()"
                                        class="flex-1 bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700">
                                        Confirm Booking
                                    </button>
                                    <button onclick="toggleForm('booking')"
                                        class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300">
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="space-y-4">
                        ${allBookings.map(booking => `
                            <div class="bg-white rounded-xl shadow-lg p-6">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 class="text-xl font-bold text-gray-800">${booking.pastor}</h3>
                                        <p class="text-sm text-gray-500 mt-1">with ${booking.memberName}</p>
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-xs font-semibold ${
                                        booking.status === 'pending' ? 'bg-yellow-100 text-yellow-700' :
                                        booking.status === 'confirmed' ? 'bg-green-100 text-green-700' :
                                        'bg-red-100 text-red-700'
                                    }">
                                        ${booking.status.toUpperCase()}
                                    </span>
                                </div>
                                <div class="flex gap-6 text-sm text-gray-600 mb-3">
                                    <span>📅 ${booking.date}</span>
                                    <span>🕐 ${booking.time}</span>
                                </div>
                                <p class="text-gray-700">${booking.reason}</p>
                            </div>
                        `).join('')}
                        ${allBookings.length === 0 ? `
                            <div class="text-center py-12">
                                <p class="text-gray-500">No bookings yet</p>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function renderPrayersPage() {
            return `
                <div class="max-w-7xl mx-auto px-4 py-8 fade-in">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <h2 class="text-3xl font-bold text-gray-800">🙏 Prayer Wall</h2>
                        <button onclick="toggleForm('prayer')"
                            class="bg-pink-600 text-white px-6 py-3 rounded-lg hover:bg-pink-700">
                            ➕ Share Prayer
                        </button>
                    </div>

                    ${state.showForms.prayer ? `
                        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
                            <h3 class="text-xl font-bold text-gray-800 mb-4">Share a Prayer Request</h3>
                            <div class="space-y-4">
                                <input type="text" id="prayerTitle" placeholder="Prayer Request Title"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                                <textarea id="prayerContent" placeholder="Share your prayer request..." rows="4"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg"></textarea>
                                <div class="flex gap-4">
                                    <button onclick="addPrayer()"
                                        class="flex-1 bg-pink-600 text-white py-3 rounded-lg font-semibold hover:bg-pink-700">
                                        Share Prayer
                                    </button>
                                    <button onclick="toggleForm('prayer')"
                                        class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300">
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${state.prayers.map(prayer => `
                            <div class="bg-white rounded-xl shadow-lg p-6">
                                <h3 class="text-lg font-bold text-gray-800 mb-2">${prayer.title}</h3>
                                <p class="text-gray-700 mb-4">${prayer.content}</p>
                                <div class="flex justify-between items-center">
                                    <div class="text-sm text-gray-500">
                                        <p>👤 ${prayer.author}</p>
                                        <p>📅 ${prayer.date}</p>
                                    </div>
                                    <button onclick="addPrayerSupport(${prayer.id})"
                                        class="flex items-center gap-2 bg-pink-50 text-pink-600 px-4 py-2 rounded-lg hover:bg-pink-100">
                                        ❤️ <span class="font-semibold">${prayer.prayerCount}</span>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                        ${state.prayers.length === 0 ? `
                            <div class="col-span-2 text-center py-12">
                                <p class="text-gray-500">No prayer requests yet</p>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function renderEventsPage() {
            return `
                <div class="max-w-7xl mx-auto px-4 py-8 fade-in">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <h2 class="text-3xl font-bold text-gray-800">🎉 Church Events</h2>
                        ${state.currentUser.role === 'admin' ? `
                            <button onclick="toggleForm('event')"
                                class="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700">
                                ➕ Create Event
                            </button>
                        ` : ''}
                    </div>

                    ${state.showForms.event && state.currentUser.role === 'admin' ? `
                        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
                            <h3 class="text-xl font-bold text-gray-800 mb-4">Create New Event</h3>
                            <div class="space-y-4">
                                <input type="text" id="eventTitle" placeholder="Event Title"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <input type="date" id="eventDate"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                                    <input type="time" id="eventTime"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                                </div>
                                <input type="text" id="eventLocation" placeholder="Event Location"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                                <textarea id="eventDescription" placeholder="Event Description" rows="4"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg"></textarea>
                                <div class="flex gap-4">
                                    <button onclick="addEvent()"
                                        class="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700">
                                        Create Event
                                    </button>
                                    <button onclick="toggleForm('event')"
                                        class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300">
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${state.events.map(event => {
                            const eventDate = new Date(event.date);
                            return `
                                <div class="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition-all">
                                    <div class="bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-lg p-4 mb-4 text-center">
                                        <p class="text-sm opacity-90">${eventDate.toLocaleDateString('en-US', { month: 'short' })}</p>
                                        <p class="text-4xl font-bold">${eventDate.getDate()}</p>
                                    </div>
                                    <h3 class="text-xl font-bold text-gray-800 mb-2">${event.title}</h3>
                                    <div class="space-y-2 text-sm text-gray-600 mb-3">
                                        <div>🕐 ${event.time}</div>
                                        ${event.location ? `<div>📍 ${event.location}</div>` : ''}
                                    </div>
                                    <p class="text-gray-700 text-sm mb-3">${event.description}</p>
                                    <p class="text-xs text-gray-400">👤 ${event.organizer}</p>
                                </div>
                            `;
                        }).join('')}
                        ${state.events.length === 0 ? `
                            <div class="col-span-3 text-center py-12">
                                <p class="text-gray-500">No upcoming events</p>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = renderLoginPage();
            } else {
                let content = '';
                if (state.currentPage === 'dashboard') content = renderDashboard();
                else if (state.currentPage === 'readings') content = renderReadingsPage();
                else if (state.currentPage === 'announcements') content = renderAnnouncementsPage();
                else if (state.currentPage === 'bookings') content = renderBookingsPage();
                else if (state.currentPage === 'prayers') content = renderPrayersPage();
                else if (state.currentPage === 'events') content = renderEventsPage();
                else if (state.currentPage === 'finances') content = renderFinancesPage();
                
                app.innerHTML = renderNavigation() + content;
            }
        }

        loadData();
        render();
    </script>
</body>
</html>
